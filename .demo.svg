<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c"/>
      <stop offset="100%" style="stop-color:#111114"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)" rx="12"/>
  <rect width="800" height="36" fill="#16161a" rx="12"/>
  <rect y="24" width="800" height="12" fill="#16161a"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="340" y="22" fill="#71717a" font-size="12" text-anchor="middle">token-meter --bar</text>

  <text x="20" y="62" fill="#a78bfa" font-weight="bold">$ token-meter --bar -a kimi-code</text>
  <text x="20" y="86" fill="#52525b">  token-meter status bar active (Ctrl+C to exit)</text>

  <!-- Status bar -->
  <rect x="16" y="110" width="768" height="40" fill="#16161a" rx="8" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <text x="32" y="135" fill="#a78bfa">⚡</text>
  <text x="52" y="135" fill="#ececf1" font-weight="bold">18:30:22</text>
  <text x="140" y="135" fill="#52525b">│</text>
  <text x="156" y="135" fill="#22c55e">T:</text><text x="172" y="135" fill="#ececf1" font-weight="bold">1.5M</text>
  <text x="220" y="135" fill="#52525b">│</text>
  <text x="236" y="135" fill="#f59e0b">$</text><text x="248" y="135" fill="#ececf1" font-weight="bold">4.54</text>
  <text x="290" y="135" fill="#52525b">│</text>
  <text x="306" y="135" fill="#a855f7">M:</text><text x="322" y="135" fill="#ececf1" font-weight="bold">7</text>
  <text x="340" y="135" fill="#52525b">│</text>
  <text x="356" y="135" fill="#06b6d4">TL:</text><text x="378" y="135" fill="#ececf1" font-weight="bold">9</text>
  <text x="396" y="135" fill="#52525b">│</text>
  <text x="412" y="135" fill="#71717a">S:</text><text x="424" y="135" fill="#ececf1" font-weight="bold">252</text>
  <text x="456" y="135" fill="#52525b">│</text>
  <text x="472" y="135" fill="#06b6d4">YOU:</text><text x="508" y="135" fill="#ececf1"> 请帮我检查一下项目...</text>
  <text x="720" y="135" fill="#52525b">│</text>

  <!-- Description -->
  <text x="20" y="180" fill="#a1a1aa">Real-time token cost meter for AI coding agents.</text>
  <text x="20" y="200" fill="#a1a1aa">Watch your tokens burn as it happens.</text>

  <text x="20" y="240" fill="#52525b">Supported:</text>
  <text x="120" y="240" fill="#22c55e">Kimi Code ✓</text>
  <text x="230" y="240" fill="#22c55e">Claude Code ✓</text>
  <text x="360" y="240" fill="#22c55e">Codex ✓</text>
  <text x="430" y="240" fill="#22c55e">OpenCode ✓</text>

  <text x="20" y="270" fill="#a78bfa">$</text><text x="32" y="270" fill="#ececf1"> npm install -g token-meter</text>

  <rect x="20" y="284" width="8" height="16" fill="#a78bfa" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
